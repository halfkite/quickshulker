import groovy.json.JsonSlurper

// One source of truth for local filenames, Loader predicates and CI release groups.
def repo = project.projectDir
while (repo != null && !new File(repo, 'development.json').isFile()) repo = repo.parentFile
if (repo == null) throw new GradleException('Cannot locate development.json')
def config = new JsonSlurper().parse(new File(repo, 'development.json'))
def group = config.fabricCompatibilityGroups.find { it.minecraftVersions.contains(project.minecraft_version) }
def games = group == null ? [project.minecraft_version] : group.minecraftVersions
def label = games.size() == 1 ? games.first() : "${games.first()}-${games.last()}"
def predicate = games.size() == 1 ? games.first() : ">=${games.first()} <=${games.last()}"
def official = providers.environmentVariable('GITHUB_ACTIONS').map { it == 'true' }.getOrElse(false) ||
    providers.gradleProperty('officialBuild').map { it.toBoolean() }.getOrElse(false)
def timestamp = providers.gradleProperty('buildTimestamp').getOrElse(
    new Date().format('yyyyMMddHHmm', TimeZone.getTimeZone('Asia/Hong_Kong')))
if (!(timestamp ==~ /\d{12}/)) throw new GradleException('buildTimestamp must be yyyyMMddHHmm')
def filename = "${project.archives_base_name}-${project.mod_version}-mc${label}-fabric${official ? '' : '-' + timestamp}.jar"

// Test the selected build version, including when one binary covers several game patches.
loom.runs.named('regression') {
    vmArg '-Dquickshulker.build.version=' + project.version
}
tasks.named('processResources') {
    inputs.property('minecraftCompatibility', predicate)
    // Existing version projects replace the exact base predicate first.
    filesMatching('fabric.mod.json') {
        filter { line -> line.replaceAll(/"minecraft"\s*:\s*"[^"]*"/, '"minecraft": "' + predicate + '"') }
    }
}
tasks.named(tasks.findByName('remapJar') == null ? 'jar' : 'remapJar') {
    archiveFileName = filename
}
