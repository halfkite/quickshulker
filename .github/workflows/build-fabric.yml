name: Build QuickShulkerMore Fabric

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'versions/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'build.ps1'
      - 'development.json'
      - '.github/workflows/build-fabric.yml'

permissions:
  contents: read

jobs:
  fabric:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - minecraft: '26.3'
            project: versions/26.3-fabric
            java: '25'
          - minecraft: '26.1'
            project: versions/26.1-fabric
            java: '25'
          - minecraft: '26.2'
            project: versions/26.2-fabric
            java: '25'
          - minecraft: '1.21'
            project: versions/1.21-fabric
            java: '21'
          - minecraft: '1.21.1'
            project: .
            java: '21'
          - minecraft: '1.21.2'
            project: versions/1.21.2-fabric
            java: '21'
          - minecraft: '1.21.3'
            project: versions/1.21.3-fabric
            java: '21'
          - minecraft: '1.21.4'
            project: versions/1.21.4-fabric
            java: '21'
          - minecraft: '1.21.5'
            project: versions/1.21.5-fabric
            java: '21'
          - minecraft: '1.21.6'
            project: versions/1.21.6-fabric
            java: '21'
          - minecraft: '1.21.7'
            project: versions/1.21.7-fabric
            java: '21'
          - minecraft: '1.21.8'
            project: versions/1.21.8-fabric
            java: '21'
          - minecraft: '1.21.9'
            project: versions/1.21.9-fabric
            java: '21'
          - minecraft: '1.21.10'
            project: versions/1.21.10-fabric
            java: '21'
          - minecraft: '1.21.11'
            project: versions/1.21.11-fabric
            java: '21'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build and run regressions (official filename)
        working-directory: ${{ matrix.project }}
        run: bash ./gradlew build printArtifactName -PofficialBuild=true --console=plain --no-daemon
      - name: Verify clean filename and record checksum
        working-directory: ${{ matrix.project }}
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          test -f "build/libs/quickshulkermore-1.0.0-${MC_VERSION}.jar"
          sha256sum "build/libs/quickshulkermore-1.0.0-${MC_VERSION}.jar" > "build/libs/quickshulkermore-1.0.0-${MC_VERSION}.jar.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: quickshulkermore-fabric-1.0.0-${{ matrix.minecraft }}
          if-no-files-found: error
          path: |
            ${{ matrix.project }}/build/libs/quickshulkermore-1.0.0-${{ matrix.minecraft }}.jar
            ${{ matrix.project }}/build/libs/quickshulkermore-1.0.0-${{ matrix.minecraft }}.jar.sha256
