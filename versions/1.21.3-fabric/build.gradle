plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = "${mod_version}-${minecraft_version}"
group = project.maven_group

def officialBuild = providers.environmentVariable('GITHUB_ACTIONS').map { it == 'true' }.getOrElse(false) || providers.gradleProperty('officialBuild').map { it.toBoolean() }.getOrElse(false)
def testTimestamp = providers.gradleProperty('buildTimestamp').getOrElse(new Date().format('yyyyMMdd-HHmmss',TimeZone.getTimeZone('Asia/Hong_Kong')))
if (!(testTimestamp ==~ /\d{8}-\d{6}/)) throw new GradleException('buildTimestamp must be yyyyMMdd-HHmmss')
tasks.withType(AbstractArchiveTask).configureEach { archiveVersion=officialBuild?project.version.toString():"${project.version}-test-${testTimestamp}" }
tasks.register('printArtifactName') { doLast { println('ARTIFACT_FILE='+tasks.named('remapJar').get().archiveFile.get().asFile.absolutePath) } }
sourceSets {
    main {
        java.setSrcDirs(['../../src/main/java','../1.21.2-fabric/src/main/java'])
        java.exclude { d -> d.file.canonicalPath.startsWith(file('../../src/main/java').canonicalPath + File.separator) && file("../1.21.2-fabric/src/main/java/${d.path}").isFile() }
        resources.setSrcDirs(['src/main/resources','../../src/main/resources'])
    }
    test {
        java.setSrcDirs(['../../src/test/java','../1.21.2-fabric/src/test/java'])
        java.exclude { d -> d.file.canonicalPath.startsWith(file('../../src/test/java').canonicalPath + File.separator) && file("../1.21.2-fabric/src/test/java/${d.path}").isFile() }
        resources.setSrcDirs(['src/test/resources','../../src/test/resources'])
    }
    amsApi { java.srcDir '../../src/amsApi/java' }
    upstreamWire { java.srcDir '../../src/upstreamWire/java' }
}
sourceSets.upstreamWire.compileClasspath=sourceSets.main.compileClasspath+sourceSets.main.output
sourceSets.test.compileClasspath+=sourceSets.upstreamWire.output
sourceSets.test.runtimeClasspath+=sourceSets.upstreamWire.output
dependencies { compileOnly sourceSets.amsApi.output }


loom {
	accessWidenerPath = file("../../src/main/resources/quickshulker.accesswidener")
	mods {
		quickshulker { sourceSet sourceSets.main }
		quickshulkerRegression { sourceSet sourceSets.test; sourceSet sourceSets.upstreamWire }
	}
	runs {
        amsWorldRegression {
            server()
            source sourceSets.test
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dquickshulker.test.ams=true'
            vmArg '-Dfabric-api.gametest.report-file=reports/ams-world-tests.xml'
            runDir 'build/ams-world-regression-run'
        }
		worldRegression {
            server()
            source sourceSets.test
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=reports/world-tests.xml'
            runDir 'build/world-regression-run'
        }
        regression {
			server()
			source sourceSets.test
			vmArg '-Dquickshulker.regression=true'
			runDir 'build/regression-run'
		}
	}
}

repositories {
	maven { url 'https://maven.fabricmc.net' }
//	maven { url 'https://maven.kyrptonaught.dev' }
	maven { url 'https://cursemaven.com' }
	maven { url "https://maven.shedaniel.me/" }
	maven { url 'https://maven.fallenbreath.me/releases' }
	maven { url 'https://jitpack.io' }
	maven { url 'https://raw.githubusercontent.com/Aton-Kish/mcmod/maven' }
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

//	modImplementation include("net.kyrptonaught:kyrptconfig:1.6.1-1.21") { exclude group: "net.fabricmc.fabric-api" }

	modImplementation("com.terraformersmc:modmenu:12.0.0") { exclude group: "net.fabricmc.fabric-api" }
	modImplementation ("curse.maven:reinforced-shulker-boxes-529874:6047615") { exclude group: "net.fabricmc.fabric-api" }
	if (providers.gradleProperty('localCompatDependencies').getOrElse('false').toBoolean()) {
		modImplementation files('../1.21.2-fabric/libs/reinforced-core-4.0.3+1.21.3.jar')
		modRuntimeOnly fileTree('../1.21.2-fabric/libs') { include 'cloth-config*.jar' }
		compileOnly files('../../libs/annotations-25.0.0.jar')
		configurations.configureEach { exclude group: 'org.jetbrains', module: 'annotations' }
	} else {
		modImplementation "atonkish.reinfcore:reinforced-core:4.0.3+1.21.3"
	}

	modImplementation include("me.fallenbreath:conditional-mixin-fabric:0.6.4")
	compileOnly group: "com.google.code.findbugs", name: "jsr305", version: "3.0.2"
}

processResources {
	inputs.property "version", project.version
    inputs.property "minecraftVersion", project.minecraft_version

	filesMatching("fabric.mod.json") {
        filter { line -> line.replace('"minecraft": "1.21.1"', '"minecraft": "' + project.minecraft_version + '"') }
		expand (
				"version": inputs.properties.version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
}

tasks.register('regressionTest') {
	dependsOn tasks.named('runRegression')
}
check.dependsOn regressionTest

jar {
	from("../../LICENSE") {
		rename { "${it}_${project.archivesBaseName}" }
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId archivesBaseName
			from components.java
		}
	}
	repositories {
		maven {
			url ='https://maven.moranpcy.com/releases'
			credentials(PasswordCredentials) {
				username = System.getenv('MAVEN_USERNAME')
				password = System.getenv('MAVEN_SECRET')
			}
		}
	}
}

tasks.named('compileUpstreamWireJava') { dependsOn tasks.named('classes') }
tasks.register('worldRegressionTest') { dependsOn tasks.named('runWorldRegression') }
check.dependsOn worldRegressionTest
