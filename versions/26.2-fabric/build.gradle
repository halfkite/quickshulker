plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

version = "${mod_version}-${minecraft_version}"
def officialBuild = providers.environmentVariable('GITHUB_ACTIONS').map { it == 'true' }.getOrElse(false) ||
    providers.gradleProperty('officialBuild').map { it.toBoolean() }.getOrElse(false)
def testTimestamp = providers.gradleProperty('buildTimestamp').getOrElse(
    new Date().format('yyyyMMddHHmm', TimeZone.getTimeZone('Asia/Hong_Kong')))
if (!(testTimestamp ==~ /\d{12}/)) throw new GradleException('buildTimestamp must be yyyyMMddHHmm')
tasks.withType(AbstractArchiveTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveVersion = officialBuild ? project.version.toString() : "${project.version}-test-${testTimestamp}"
}
tasks.register('printArtifactName') {
    doLast { println("ARTIFACT_FILE=" + tasks.named('jar').get().archiveFile.get().asFile.absolutePath) }
}
group = project.maven_group

sourceSets {
    ['main', 'test'].each { name ->
        def roots = [file("src/${name}/java"), file("../26.3-fabric/src/${name}/java")]
        getByName(name) {
            java.setSrcDirs(roots)
            java.exclude { entry ->
                entry.file.canonicalPath.startsWith(roots[1].canonicalPath + File.separator) &&
                    new File(roots[0], entry.path).isFile()
            }
            resources.setSrcDirs(["src/${name}/resources", "../26.3-fabric/src/${name}/resources"])
        }
    }
    amsApi { java.srcDir '../26.3-fabric/src/amsApi/java' }
    upstreamWire { java.srcDir '../26.3-fabric/src/upstreamWire/java' }
}
sourceSets.upstreamWire.compileClasspath = sourceSets.main.compileClasspath + sourceSets.main.output
sourceSets.test.compileClasspath += sourceSets.upstreamWire.output
sourceSets.test.runtimeClasspath += sourceSets.upstreamWire.output
dependencies { compileOnly sourceSets.amsApi.output }

loom {
	accessWidenerPath = file("../26.3-fabric/src/main/resources/quickshulker.accesswidener")
    mods {
        quickshulker { sourceSet sourceSets.main }
        quickshulkerRegression { sourceSet sourceSets.test; sourceSet sourceSets.upstreamWire }
    }
    runs {
        worldRegression {
            server()
            source sourceSets.test
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=reports/world-tests.xml'
            runDir 'build/world-regression-run'
        }
        regression {
            server()
            source sourceSets.test
            vmArg "-Dquickshulker.regression=true"
            runDir "build/regression-run"
        }
    }
}

repositories {
	maven { url 'https://maven.fabricmc.net' }
	maven { url 'https://cursemaven.com' }
	maven { url 'https://api.modrinth.com/maven'}
	maven { url "https://maven.shedaniel.me/" }
	maven { url 'https://maven.fallenbreath.me/releases' }
	maven { url 'https://jitpack.io' }
	maven { url 'https://raw.githubusercontent.com/Aton-Kish/mcmod/maven' }
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation ("com.terraformersmc:modmenu:20.0.1") { exclude group: "net.fabricmc.fabric-api" }
//	modImplementation ("curse.maven:reinforced-shulker-boxes-529874:7225066") { exclude group: "net.fabricmc.fabric-api" }
//	modImplementation "atonkish.reinfcore:reinforced-core:4.0.8+1.21.10"

	implementation include("me.fallenbreath:conditional-mixin-fabric:0.6.4")
	compileOnly group: "com.google.code.findbugs", name: "jsr305", version: "3.0.2"
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand (
				"version": inputs.properties.version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java
		}
	}
	repositories {
		maven {
			url ='https://maven.moranpcy.com/releases'
			credentials(PasswordCredentials) {
				username = System.getenv("MAVEN_USERNAME")
				password = System.getenv("MAVEN_SECRET")
			}
		}
	}
}
tasks.register('regressionTest') { dependsOn tasks.named('runRegression') }
check.dependsOn regressionTest
tasks.register('worldRegressionTest') { dependsOn tasks.named('runWorldRegression') }
check.dependsOn worldRegressionTest
// The tests run through Fabric/Knot above, not a JUnit discovery engine.
tasks.named('test') {
    dependsOn regressionTest, worldRegressionTest
    failOnNoDiscoveredTests = false
}


// Keep optional API signatures out of every distributable and runtime.
tasks.named('compileUpstreamWireJava') { dependsOn tasks.named('classes') }
apply from: file('../../gradle/fabric-compatibility.gradle')
