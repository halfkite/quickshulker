plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = "${mod_version}-${minecraft_version}"
group = project.maven_group


loom {
	accessWidenerPath = file("src/main/resources/quickshulker.accesswidener")
	mods {
		quickshulker { sourceSet sourceSets.main }
		quickshulkerRegression { sourceSet sourceSets.test }
	}
	runs {
		regression {
			server()
			source sourceSets.test
			vmArg '-Dquickshulker.regression=true'
			runDir 'build/regression-run'
		}
	}
}

repositories {
	maven { url 'https://maven.fabricmc.net' }
//	maven { url 'https://maven.kyrptonaught.dev' }
	maven { url 'https://cursemaven.com' }
	maven { url "https://maven.shedaniel.me/" }
	maven { url 'https://maven.fallenbreath.me/releases' }
	maven { url 'https://jitpack.io' }
	maven { url 'https://raw.githubusercontent.com/Aton-Kish/mcmod/maven' }
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

//	modImplementation include("net.kyrptonaught:kyrptconfig:1.6.1-1.21") { exclude group: "net.fabricmc.fabric-api" }

	modImplementation("com.terraformersmc:modmenu:11.0.3") { exclude group: "net.fabricmc.fabric-api" }
	modImplementation ("curse.maven:reinforced-shulker-boxes-529874:6038336") { exclude group: "net.fabricmc.fabric-api" }
	if (providers.gradleProperty('localCompatDependencies').getOrElse('false').toBoolean()) {
		modImplementation files('libs/reinforced-core-4.0.2+1.21.1.jar')
		modRuntimeOnly files('libs/cloth-config-fabric-15.0.130-fabric.jar')
		compileOnly files('libs/annotations-25.0.0.jar')
		configurations.configureEach { exclude group: 'org.jetbrains', module: 'annotations' }
	} else {
		modImplementation "atonkish.reinfcore:reinforced-core:4.0.2+1.21.1"
	}

	modImplementation include("me.fallenbreath:conditional-mixin-fabric:0.6.4")
	compileOnly group: "com.google.code.findbugs", name: "jsr305", version: "3.0.2"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand (
				"version": inputs.properties.version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
}

tasks.register('regressionTest') {
	dependsOn tasks.named('runRegression')
}
check.dependsOn regressionTest

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}" }
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId archivesBaseName
			from components.java
		}
	}
	repositories {
		maven {
			url ='https://maven.moranpcy.com/releases'
			credentials(PasswordCredentials) {
				username = System.getenv('MAVEN_USERNAME')
				password = System.getenv('MAVEN_SECRET')
			}
		}
	}
}
